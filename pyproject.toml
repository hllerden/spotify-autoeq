[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-autoeq"
dynamic = ["version"]
description = "Switch the PulseEffects equalizer automatically according to the genre of the track playing in Spotify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Halil" }]
keywords = ["spotify", "equalizer", "pulseaudio", "pulseeffects", "linux", "mpris", "playerctl", "genre"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://github.com/hllerden/spotify-autoeq"
Repository = "https://github.com/hllerden/spotify-autoeq"
Issues = "https://github.com/hllerden/spotify-autoeq/issues"
Changelog = "https://github.com/hllerden/spotify-autoeq/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
spotify-autoeq = "spotify_autoeq.apps.autoeq.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "spotify_autoeq.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"spotify_autoeq.apps.autoeq" = ["data/*"]
"spotify_autoeq.modules.preset_mapper" = ["*.yaml"]
"spotify_autoeq" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "-q"
