name: Release

# Publishes to PyPI when a branch named release/v<version> is pushed, for
# example release/v1.0.0. Tags and other branches never publish.
# Requires a trusted publisher configured on PyPI for this repository and a
# GitHub environment named "pypi" restricted to the branch pattern release/*.

on:
  push:
    branches: ["release/v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that the branch name matches the package version
        run: |
          expected="${GITHUB_REF_NAME#release/v}"
          actual="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/spotify_autoeq/__init__.py').read_text()).group(1))")"
          echo "branch version: $expected, package version: $actual"
          test "$expected" = "$actual"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
